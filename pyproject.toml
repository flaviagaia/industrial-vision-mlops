[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steelvision"
version = "0.1.0"
description = "Inspeção visual de aço com U-Net em PyTorch e avaliação reproduzível"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "numpy>=1.26,<3", "Pillow>=10,<13", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "nbformat>=5,<6"]

[project.scripts]
steelvision = "steelvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
